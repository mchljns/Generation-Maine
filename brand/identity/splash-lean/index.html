<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Generation Maine, concept A</title>
<meta name="description" content="The bare bones splash page in both concepts, in the look of the Maine Policy Institute family. Toggle between them.">
<style>
html,body{margin:0;height:100%;background:#0F2E4D}
iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:#fff}
.sw{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:50;display:flex;gap:2px;padding:4px;background:rgba(15,46,77,.92);border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font:600 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.08em;text-transform:uppercase}
.sw button{white-space:nowrap;appearance:none;border:0;background:transparent;color:#fff;padding:12px 18px;border-radius:999px;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;opacity:.75}
.sw button[aria-pressed="true"]{background:#EFB443;color:#0F2E4D;opacity:1}
.sw button:focus-visible{outline:2px solid #EFB443;outline-offset:2px}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);transform:translateX(-50%);z-index:50;color:rgba(255,255,255,.8);font:12px/1.3 system-ui,sans-serif;background:rgba(15,46,77,.75);padding:6px 10px;border-radius:6px;pointer-events:none;transition:opacity .4s}
.hint.gone{opacity:0}
</style></head><body>
<iframe id="f" title="Generation Maine preview" src="../v2-a/index.html?v=8ca58e48" allow="autoplay"></iframe>
<div class="hint" id="hint">Concept A, with and without the Eurostile label face. Switch below.</div>
<div class="sw" role="group" aria-label="Concept">
  <button type="button" data-k="a" aria-pressed="true">Concept A</button>
  <button type="button" data-k="b" aria-pressed="false">Eurostile labels</button>
</div>
<script>
(() => {
  const f = document.getElementById('f'), btns = [...document.querySelectorAll('.sw button')], hint = document.getElementById('hint');
  const base = location.pathname.replace(/[^/]*$/, '');
  function show(k, push) {
        const want = (k === 'b' ? '../v2-a-labels/index.html' : '../v2-a/index.html') + '?v=8ca58e48'; if (!f.getAttribute('src').endsWith(want.slice(3))) f.src = want;
    btns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
    document.title = k === 'b' ? 'Generation Maine, Eurostile labels' : 'Generation Maine, concept A';
    if (push) history.replaceState(null, '', '#' + k);
    try { localStorage.setItem('gm-lean', k); } catch (e) {}
  }
  btns.forEach(b => b.addEventListener('click', () => { show(b.dataset.k, true); hint.classList.add('gone'); }));
  addEventListener('keydown', e => { if (e.key === 'a' || e.key === 'A') show('a', true); if (e.key === 'b' || e.key === 'B' || e.key === 'e' || e.key === 'E') show('b', true); });
  let k = (location.hash || '').replace('#', '');
  if (k !== 'a' && k !== 'b') { try { k = localStorage.getItem('gm-lean') || 'a'; } catch (e) { k = 'a'; } }
  show(k, false);
  setTimeout(() => hint.classList.add('gone'), 6000);
})();
</script></body></html>
